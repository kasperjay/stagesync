<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concert screening · StageSync</title>
<style>body{background:#101014;color:#ededf2;font:16px system-ui;margin:2rem auto;padding:0 1rem;max-width:1100px}a{color:#b5a0ff}button,select{background:#292532;color:white;border:1px solid #75638e;border-radius:5px;padding:.6rem}table{width:100%;border-collapse:collapse;margin-top:1rem}td,th{text-align:left;padding:.8rem;border-bottom:1px solid #38333e;overflow-wrap:anywhere}td:first-child{max-width:300px}small{color:#c5bfd0}button:disabled{opacity:.5}</style>
<a href="/workspace">← Library</a><h1>Concert screening</h1>
<p>Already-tagged videos are exempt from screening. New untagged recordings require automatic acceptance. Uncertain and failed analyses remain here. Original media and publication history are retained.</p>
<label>Show <select id="filter"><option value="held">Awaiting acceptance</option><option value="all">All candidates</option></select></label>
<button id="refresh">Refresh</button><p id="summary" role="status"></p>
<table><thead><tr><th>Recording</th><th>Decision</th><th>Reason</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const rows=document.getElementById('rows'),summary=document.getElementById('summary');
async function load(){try{const response=await fetch('/api/screening');if(!response.ok)throw Error('Could not load screening records');const {items}=await response.json();summary.textContent=`${items.filter(x=>x.exempt).length} tagged/exempt · ${items.filter(x=>x.decision==='accept'&&!x.exempt).length} accepted · ${items.filter(x=>x.decision!=='accept'&&!x.exempt).length} awaiting acceptance`;rows.replaceChildren();for(const item of items.filter(x=>document.getElementById('filter').value==='all'||x.decision!=='accept'&&!x.exempt)){const tr=document.createElement('tr');for(const text of [item.filename,item.exempt?'Exempt (tagged)':item.decision,`${item.reason} (attempts: ${item.attempts})`]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td');if(item.decision!=='accept'&&!item.exempt){const button=document.createElement('button');button.textContent='Retry screening';button.onclick=async()=>{button.disabled=true;button.textContent='Screening…';try{const r=await fetch(`/api/screening/${encodeURIComponent(item.video_id)}/retry`,{method:'POST'});if(!r.ok)throw Error('Retry failed');await load()}catch(e){summary.textContent=e.message;button.disabled=false;button.textContent='Retry screening'}};td.append(button)}tr.append(td);rows.append(tr)}}catch(e){summary.textContent=e.message}}
document.getElementById('refresh').onclick=load;document.getElementById('filter').onchange=load;load();
</script></html>
