[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stagesync"
version = "0.1.0"
description = "Intelligent Live Concert Video Ingestion & YouTube Archival Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "StageSync Team", email = "dev@stagesync.local" },
]
keywords = ["concerts", "video", "youtube", "music", "google-photos", "shazam", "setlist-fm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dateutil>=2.9.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "shazamio>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
stagesync = "stagesync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stagesync*"]
